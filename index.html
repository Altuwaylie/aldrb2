<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لعبة شد الحبل في جدول الضرب</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      direction: rtl;
      margin: 0;
      background: #f5f5f5;
      min-height: 100vh;
    }

    h1, h2, h3 { margin: 10px 0; }

    .hidden { display: none !important; }

    .btn {
      padding: 10px 18px;
      margin: 6px;
      font-size: .95rem;
      cursor: pointer;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #ff9800, #f44336);
      color: #fff;
      box-shadow: 0 4px 0 #e65100;
      transition: transform .1s, box-shadow .1s;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #e65100;
    }

    .btn.gray {
      background: linear-gradient(135deg, #78909c, #546e7a);
      box-shadow: 0 4px 0 #37474f;
    }

    .btn.green {
      background: linear-gradient(135deg, #66bb6a, #43a047);
      box-shadow: 0 4px 0 #2e7d32;
    }

    .option-btn {
      display: block;
      width: 100%;
      margin: 6px auto;
      font-size: 1.1rem;
      border-radius: 14px;
      padding: 10px 8px;
      transition: transform .2s, box-shadow .2s, background .2s;
    }

    #main-menu,
    #single-play {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    #game-card {
      background: rgba(255,255,255,.95);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,.15);
      margin-top: 12px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: .85rem;
      flex-wrap: wrap;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 999px;
      background: #e3f2fd;
      font-size: .8rem;
    }

    .badge.error {
      background: #ffebee;
      color: #c62828;
    }

    .badge.timer {
      background: #fff3e0;
      color: #e65100;
      font-weight: 700;
    }

    #single-question {
      font-size: 1.8rem;
      min-height: 44px;
    }

    #versus-play {
      padding: 6px;
    }

    #versus-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: calc(100vh - 12px);
    }

    #question-bar {
      background: #fff;
      border-radius: 18px;
      padding: 8px 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }

    #tug-area {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #tug-bar {
      width: 100%;
      max-width: 600px;
      height: 14px;
      background: #ffe0b2;
      position: relative;
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 0 5px rgba(0,0,0,.25);
    }

    #tug-marker {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      position: absolute;
      top: -3px;
      left: calc(50% - 10px);
      transition: left .35s ease-out, background .25s;
      box-shadow: 0 0 8px rgba(0,0,0,.4);
      background: #ffc107;
    }

    #center-question {
      font-size: 1.5rem;
      font-weight: 800;
      margin-top: 8px;
      min-height: 36px;
    }

    /* الجهتان تبقيان جنبًا إلى جنب دائمًا */
    #sides-wrapper {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 8px;
      min-height: 0;
    }

    .side {
      flex: 1;
      border-radius: 18px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
      position: relative;
    }

    #side-left {
      background: linear-gradient(135deg, #e3f2fd, #bbdefb);
    }

    #side-right {
      background: linear-gradient(135deg, #ffebee, #ffcdd2);
    }

    .player-title {
      font-size: .95rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .big-timer {
      font-size: 3.2rem;
      font-weight: 900;
      color: #c62828;
      text-shadow: 0 4px 12px rgba(198,40,40,.35);
      animation: timerPop .9s ease infinite;
      margin-bottom: 2px;
    }

    .big-timer.hidden {
      display: none;
    }

    @keyframes timerPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    .options-column {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
      min-height: 180px;
      justify-content: center;
    }

    .side-answer {
      font-size: 1.6rem;
      font-weight: 900;
      color: #1b5e20;
      background: #e8f5e9;
      border-radius: 16px;
      padding: 14px 8px;
    }

    .side-waiting {
      font-size: 1rem;
      font-weight: 700;
      color: #555;
    }

    .pulse { animation: pulse .6s ease-out; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.07); }
      100% { transform: scale(1); }
    }

    .shake { animation: shake .45s; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-3px); }
    }

    .correct {
      background: #4caf50 !important;
      color: #fff !important;
      font-size: 1.5rem !important;
      transform: scale(1.1);
      box-shadow: 0 0 0 4px rgba(76,175,80,.45) !important;
      z-index: 5;
    }

    .wrong {
      background: #f44336 !important;
      color: #fff !important;
      opacity: .85;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    #result-overlay { z-index: 9998; }
    #confirm-overlay { z-index: 10000; }

    .overlay-card {
      background: #fff;
      border-radius: 24px;
      padding: 20px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    .overlay-card h2 { margin-top: 0; }

    .result-list {
      text-align: right;
      font-size: 1rem;
      line-height: 1.8;
      margin: 10px 0;
    }

    @media (max-width: 600px) {
      #center-question {
        font-size: 1.2rem;
        min-height: 30px;
      }

      .player-title {
        font-size: .8rem;
      }

      .option-btn {
        font-size: .95rem;
        padding: 8px 6px;
        margin: 4px auto;
      }

      .options-column {
        min-height: 150px;
        gap: 4px;
      }

      .big-timer {
        font-size: 2.4rem;
      }

      .side-answer {
        font-size: 1.2rem;
        padding: 10px 6px;
      }

      .side-waiting {
        font-size: .85rem;
      }

      .btn {
        padding: 8px 14px;
        font-size: .85rem;
        margin: 4px;
      }
    }

    @media (max-width: 380px) {
      .option-btn {
        font-size: .85rem;
        padding: 7px 4px;
      }

      .options-column {
        min-height: 130px;
      }

      .side-answer {
        font-size: 1rem;
      }

      .big-timer {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <div id="main-menu">
    <h1>لعبة شد الحبل في جدول الضرب</h1>
    <p>تحدَّ صديقك أو العب وحدك وتعلّم جدول الضرب من ١ إلى ٩!</p>

    <button class="btn" onclick="selectMode('single')">لعب فردي</button>
    <button class="btn" onclick="selectMode('versus')">لعب تنافسي</button>
  </div>

  <div id="single-play" class="hidden">
    <h2>لعب فردي</h2>

    <div id="game-card">
      <div class="meta-row">
        <span class="badge">
          السؤال: <span id="single-q-index">٠</span>
        </span>

        <span class="badge">
          النقاط: <span id="single-score">٠</span>
        </span>

        <span class="badge error">
          الأخطاء: <span id="single-errors">٠</span>
        </span>

        <span class="badge timer">
          الوقت: <span id="single-timer">٠٠:٠٠</span>
        </span>
      </div>

      <h3 id="single-question"></h3>

      <div id="single-options"></div>

      <div style="margin-top:15px;">
        <button class="btn green" onclick="requestEndSingle()">إنهاء اللعبة</button>
        <button class="btn" onclick="confirmNewGame()">بداية جديدة</button>
        <button class="btn gray" onclick="confirmGoHome()">الرئيسية</button>
      </div>
    </div>
  </div>

  <div id="versus-play" class="hidden">
    <div id="versus-container">

      <div id="question-bar">
        <div id="tug-area">
          <div id="tug-bar">
            <div id="tug-marker"></div>
          </div>
        </div>

        <div id="center-question"></div>

        <div style="margin-top:6px;">
          <button class="btn" onclick="confirmNewGame()">بداية جديدة</button>
          <button class="btn gray" onclick="confirmGoHome()">الرئيسية</button>
        </div>
      </div>

      <div id="sides-wrapper">
        <div id="side-left" class="side">
          <div class="player-title">👦 اللاعب الأول</div>

          <div id="p1-big-timer" class="big-timer hidden">٥</div>

          <div class="options-column" id="p1-options"></div>
        </div>

        <div id="side-right" class="side">
          <div class="player-title">👦 اللاعب الثاني</div>

          <div id="p2-big-timer" class="big-timer hidden">٥</div>

          <div class="options-column" id="p2-options"></div>
        </div>
      </div>

    </div>
  </div>

  <div id="result-overlay" class="overlay hidden">
    <div class="overlay-card">
      <h2 id="result-title"></h2>
      <div class="result-list" id="result-details"></div>

      <button class="btn green" onclick="hideResult()">إغلاق</button>
      <button class="btn" onclick="confirmNewGame()">بداية جديدة</button>
      <button class="btn gray" onclick="confirmGoHome()">الرئيسية</button>
    </div>
  </div>

  <div id="confirm-overlay" class="overlay hidden">
    <div class="overlay-card">
      <h2 id="confirm-title">تأكيد</h2>
      <p id="confirm-text"></p>

      <button class="btn green" id="confirm-yes">نعم، تأكيد</button>
      <button class="btn gray" onclick="hideConfirm()">إلغاء</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
